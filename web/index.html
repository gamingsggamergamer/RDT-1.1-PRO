<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RDT-1.1 Pro</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app">

        <header>

            <h1>RDT-1.1 Pro</h1>

            <p>
                Roblox Development AI
            </p>

            <span id="status">
                Checking connection...
            </span>

        </header>


        <section
            id="chat"
            class="chat"
        ></section>


        <form
            id="chat-form"
            class="input-area"
        >

            <textarea
                id="prompt"
                placeholder="Ask RDT-1.1 Pro about Roblox..."
                rows="3"
                required
            ></textarea>

            <button
                type="submit"
                id="send"
            >
                Send
            </button>

        </form>

    </main>

    <script src="app.js"></script>

</body>

</html>
