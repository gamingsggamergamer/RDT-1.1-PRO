<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox LLM Level 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat {
            width: min(700px, 95vw);
            height: min(800px, 92vh);
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 18px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .status {
            margin-top: 5px;
            font-size: 13px;
            color: #8cff8c;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            background: #2d2d2d;
            margin-left: 40px;
        }

        .ai {
            background: #202020;
            border: 1px solid #333;
            margin-right: 40px;
        }

        .label {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #333;
        }

        #prompt {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 140px;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #111;
            color: white;
            outline: none;
            font-family: inherit;
        }

        #send {
            width: 80px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h1>🤖 Roblox LLM Level 2</h1>
        <div class="status">● Online</div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
        <textarea
            id="prompt"
            placeholder="Ask your Roblox AI..."
        ></textarea>

        <button id="send">Send</button>
    </div>

</div>

<script>
    const API_URL = "https://testrdt-6thc.onrender.com/generate";

    const messages = document.getElementById("messages");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");

    function addMessage(label, text, type) {
        const message = document.createElement("div");
        message.className = `message ${type}`;

        const labelElement = document.createElement("div");
        labelElement.className = "label";
        labelElement.textContent = label;

        const textElement = document.createElement("div");
        textElement.textContent = text;

        message.appendChild(labelElement);
        message.appendChild(textElement);

        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
        const prompt = promptInput.value.trim();

        if (!prompt || sendButton.disabled) {
            return;
        }

        addMessage("You", prompt, "user");

        promptInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    prompt: prompt,
                    max_new_tokens: 150,
                    temperature: 0.8,
                    top_k: 20
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            addMessage(
                "Roblox LLM",
                data.text || "The model returned no text.",
                "ai"
            );

        } catch (error) {
            addMessage(
                "Error",
                "Could not reach the Roblox LLM: " + error.message,
                "ai"
            );
        }

        sendButton.disabled = false;
        sendButton.textContent = "Send";
        promptInput.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    promptInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    addMessage(
        "Roblox LLM",
        "Hey! Ask me something about Roblox development.",
        "ai"
    );
</script>

</body>
</html>
